########################################
# Copyright Volkan Kücükbudak
# Kernel & Network Hardening
# Ubuntu 24.04 LTS | /etc/sysctl.d/99-hardening.conf
# Apply with: sysctl --system
########################################

########################################
# IP Spoofing Protection
########################################
# Enable Reverse Path Filtering to block IP spoofed packets.
# Ensures incoming packets use a valid return path — drops faked source IPs.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# Wildcard applies rp_filter to all current and future interfaces.
# WARNING: This can break Tor relays, VPNs, or multi-homed setups.
# Remove or override per-interface if you run a relay/bridge.
net.ipv4.conf.*.rp_filter = 1

########################################
# ICMP & Network Noise Handling
########################################
# Ignore ICMP broadcast requests — prevents smurf amplification attacks.
net.ipv4.icmp_echo_ignore_broadcasts = 1
# Ignore malformed or bogus ICMP error responses — reduces noise and attack surface.
net.ipv4.icmp_ignore_bogus_error_responses = 1
# Ignore ALL incoming pings — optional but reduces fingerprinting and noise.
# Disable this if your monitoring system relies on ICMP ping checks.
net.ipv4.icmp_echo_ignore_all = 1

########################################
# Source Routing (Never Trust It)
########################################
# Disable source-routed packets — attackers can use this to bypass firewall rules
# by specifying their own routing path through the network.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

########################################
# ICMP Redirects (MitM Risk)
########################################
# Do not accept ICMP redirects — prevents attackers from redirecting traffic
# through a rogue gateway (classic man-in-the-middle vector).
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
# Do not send ICMP redirects — this server is not a router.
# Sending redirects can expose routing topology to attackers.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

########################################
# TCP SYN Flood Protection
########################################
# Enable SYN cookies — defends against SYN flood attacks without dropping
# legitimate connections. Kernel generates a cookie instead of allocating state.
net.ipv4.tcp_syncookies = 1
# Increase SYN backlog queue — handles burst connection attempts more gracefully.
net.ipv4.tcp_max_syn_backlog = 2048
# Reduce SYN-ACK retries — speeds up cleanup of half-open connections from floods.
net.ipv4.tcp_synack_retries = 2
# Reduce SYN retries — limits how long the kernel retries failed outgoing connections.
net.ipv4.tcp_syn_retries = 5

########################################
# Suspicious Packet Logging
########################################
# Log packets with impossible/forged source addresses (Martian packets).
# Useful for detecting spoofing attempts — check /var/log/kern.log.
net.ipv4.conf.all.log_martians = 1

########################################
# Kernel-Level Hardening
########################################
# Disable SysRq key combinations — prevents local/physical keyboard-based attacks
# like forcing a reboot or dumping memory via magic key sequences.
kernel.sysrq = 0
# Restrict dmesg access to root only — kernel log can leak sensitive info
# like memory addresses, hardware details, and driver internals.
kernel.dmesg_restrict = 1
# Hide kernel symbol addresses from unprivileged users.
# Prevents info leaks that help attackers bypass KASLR.
# 2 = hide even from root (except in kernel itself).
kernel.kptr_restrict = 2

########################################
# Filesystem Hardlink/Symlink Protection
########################################
# Prevent symlink-based privilege escalation attacks in world-writable directories
# (e.g. /tmp). Only the file owner may follow symlinks they did not create.
fs.protected_symlinks = 1
# Prevent hardlink-based attacks — users can only create hardlinks to files
# they own or have read/write access to.
fs.protected_hardlinks = 1

########################################
# TCP Time-Wait Assassination Protection
########################################
# Protect against TIME-WAIT assassination attacks as described in RFC1337.
# Drops RST packets targeting connections in TIME-WAIT state.
net.ipv4.tcp_rfc1337 = 1

########################################
# Core Dump Restriction
########################################
# Disable core dumps for setuid binaries — core dumps can expose sensitive
# memory content (passwords, keys) from privileged processes.
# Ubuntu 24.04 default is 2 (restricted) — we set it to 0 (fully disabled).
fs.suid_dumpable = 0

########################################
# TCP Timestamps
########################################
# Disable TCP timestamps — timestamps can be used to fingerprint the system
# uptime and calculate kernel version, aiding targeted attacks.
net.ipv4.tcp_timestamps = 0

########################################
# IPv6 Router Advertisements
########################################
# Do not accept IPv6 Router Advertisements — this server has a static IPv6
# config and should not auto-configure via RA. Accepting RA can allow
# a rogue router to redirect IPv6 traffic.
# Note: eth0.accept_ra is already 0 by default on Ubuntu 24.04,
# but all/default override interface-specific settings.
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0
