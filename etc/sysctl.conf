########################################
# IP Spoofing Protection
########################################

# Enable Reverse Path Filtering to block IP spoofed packets
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# This wildcard can break Tor or VPN traffic, use with caution!
# Consider removing or overriding it if you're running a relay/bridge
net.ipv4.conf.*.rp_filter = 1

########################################
# ICMP & Network Noise Handling
########################################

# Ignore ICMP broadcast requests (prevents smurf attacks)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore malformed or bogus ICMP error messages
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Ignore ALL incoming pings (optional – disables all ICMP echo replies)
net.ipv4.icmp_echo_ignore_all = 1

########################################
# Source Routing (Never Trust It)
########################################

# Disable source routed packets (prevents attackers from bypassing routing rules)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

########################################
# ICMP Redirects (MitM Risk)
########################################

# Prevent ICMP redirect acceptance (spoofed gateway attacks)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Prevent system from sending ICMP redirects (keep routing consistent)
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

########################################
# TCP SYN Flood Protection
########################################

# Enable TCP SYN cookies (defends against SYN flood attacks)
net.ipv4.tcp_syncookies = 1

# Queue size for SYN backlog (higher = better for burst handling)
net.ipv4.tcp_max_syn_backlog = 2048

# Lower retry counts for SYN-ACK and SYN (speeds up failed connection cleanup)
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_syn_retries = 5

########################################
# Suspicious Packet Logging
########################################

# Log packets with impossible addresses (Martians)
net.ipv4.conf.all.log_martians = 1

########################################
# Kernel-Level Hardening
########################################

# Disable SysRq combinations (prevents physical keyboard-based hacks)
kernel.sysrq = 0

# Restrict access to kernel logs (dmesg)
kernel.dmesg_restrict = 1

# Hide kernel pointers from unprivileged users (protects from info leaks)
kernel.kptr_restrict = 2

########################################
# Filesystem Hardlink/Symlink Protection
########################################

# Prevent symlink attacks by disallowing unsafe symlinks
fs.protected_symlinks = 1

# Prevent hardlink exploits by only allowing safe usage
fs.protected_hardlinks = 1

########################################
# TCP Time-Wait Assassination Protection
########################################

# Protect against TIME-WAIT hijacking per RFC1337
net.ipv4.tcp_rfc1337 = 1
